<!doctype html>
<!-- GENERATED by build.py from src/ and data/. Edit those, not this file. -->
<html lang="en-GB" data-root="{{root}}" data-page="{{page}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonical}}" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="author" content="Archive 88" />
  <meta name="theme-color" content="#1B211D" />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Open Graph (Facebook, Instagram link previews, iMessage, Slack, LinkedIn) -->
  <meta property="og:type" content="{{og_type}}" />
  <meta property="og:site_name" content="Archive 88" />
  <meta property="og:locale" content="{{locale}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="{{og_image}}" />
  <meta property="og:image:secure_url" content="{{og_image}}" />
  <meta property="og:image:type" content="{{og_image_type}}" />
  <meta property="og:image:width" content="{{og_image_w}}" />
  <meta property="og:image:height" content="{{og_image_h}}" />
  <meta property="og:image:alt" content="{{og_image_alt}}" />
{{extra_meta}}
  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{og_image}}" />
  <meta name="twitter:image:alt" content="{{og_image_alt}}" />

  <!-- Icons -->
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="{{root}}assets/img/icon-512.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="{{root}}site.webmanifest" />

  <!-- Fonts are self-hosted (faster, and no visitor data sent to Google) -->
  <link rel="preload" href="{{root}}assets/fonts/archivo-narrow-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{root}}assets/fonts/fonts.css" />
  <link rel="stylesheet" href="{{root}}assets/css/style.css" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
{{jsonld}}
  </script>
  <!-- Page transitions: note whether this page arrived via a cross-page view transition -->
  <script>addEventListener("pagereveal",function(e){if(e.viewTransition)document.documentElement.classList.add("vt-in")});</script>
</head>
