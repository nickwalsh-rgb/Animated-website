  <main id="top" class="pdp" data-theme="paper">
    <nav class="crumbs" aria-label="Breadcrumb">
      <ol>
        <li><a href="{{home}}#archive">Archive</a></li>
        <li><a href="{{home}}#shop-{{category}}">{{category_title}}</a></li>
        <li aria-current="page">No. {{number}}</li>
      </ol>
    </nav>

    <div class="pdp__grid">
      <!-- Gallery: real photos from assets/products/{{handle}}/, or labelled slots until they exist -->
      <div class="pdp__gallery" aria-label="Photos of the {{title_lower}}">
        <div class="pdp__slides js-slides" tabindex="0" role="region" aria-label="Photos, scroll sideways for more">
{{gallery}}
        </div>
        <div class="pdp__pager js-pager" aria-hidden="true">{{pager}}</div>
      </div>

      <div class="pdp__info">
        <div class="pdp__head js-pdp-in">
          <p class="pdp__meta"><span>No. {{number}}</span><span>One of one</span></p>
          <h1 class="pdp__title">{{name}}</h1>
          <p class="pdp__price">{{price_fmt}}</p>
        </div>

        <dl class="pdp__facts js-pdp-in">
          <div><dt>Size</dt><dd>{{size}}</dd></div>
          <div><dt>Era</dt><dd>{{era}}</dd></div>
          <div><dt>Condition</dt><dd>{{condition}}</dd></div>
        </dl>

        <p class="pdp__desc js-pdp-in">{{description}}</p>

        <div class="pdp__buy js-pdp-in">
{{buy}}
        </div>

        <div class="pdp__details js-pdp-in">
{{details}}
        </div>
      </div>
    </div>

    <section class="pdp__more" aria-labelledby="more-title">
      <h2 id="more-title" class="pdp__more-title">More from the archive</h2>
      <div class="pdp__more-grid">
{{more}}
      </div>
    </section>
  </main>
